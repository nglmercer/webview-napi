name: Build

env:
  DEBUG: napi:*
  APP_NAME: webview-napi
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  CARGO_TERM_COLOR: always

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'workflow_call' && github.event.pull_request.head.ref || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.settings.os }} - ${{ matrix.settings.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            build_script: |
              export PKG_CONFIG_ALLOW_CROSS=1
              bun run build:esm -- --target aarch64-apple-darwin
              bun run build:cjs -- --target aarch64-apple-darwin

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sys_deps: pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev libgtk-3-dev

          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross_arch: arm64
            cross_sys_deps: >-
              libwebkit2gtk-4.1-dev:arm64
              libsoup-3.0-dev:arm64
              libgtk-3-dev:arm64
              libx11-dev:arm64
              libxkbcommon-dev:arm64
              libwayland-dev:arm64
              libxcb-shape0-dev:arm64
              libxcb-xfixes0-dev:arm64
              libglib2.0-dev:arm64
              libcairo2-dev:arm64
              libpango1.0-dev:arm64
              libatk1.0-dev:arm64
              libgdk-pixbuf2.0-dev:arm64
            cross_gcc: gcc-aarch64-linux-gnu
            cross_gpp: g++-aarch64-linux-gnu
            cross_triplet: aarch64-linux-gnu
            build_script: |
              set -e
              rustup target add aarch64-unknown-linux-gnu
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
              export AR=aarch64-linux-gnu-ar
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              bun run build:esm -- --target aarch64-unknown-linux-gnu
              bun run build:cjs -- --target aarch64-unknown-linux-gnu

          # Linux ARMv7
          - os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            cross_arch: armhf
            cross_sys_deps: >-
              libwebkit2gtk-4.1-dev:armhf
              libsoup-3.0-dev:armhf
              libgtk-3-dev:armhf
              libx11-dev:armhf
              libxkbcommon-dev:armhf
              libwayland-dev:armhf
              libxcb-shape0-dev:armhf
              libxcb-xfixes0-dev:armhf
              libglib2.0-dev:armhf
              libcairo2-dev:armhf
              libpango1.0-dev:armhf
              libatk1.0-dev:armhf
              libgdk-pixbuf2.0-dev:armhf
            cross_gcc: gcc-arm-linux-gnueabihf
            cross_gpp: g++-arm-linux-gnueabihf
            cross_triplet: arm-linux-gnueabihf
            build_script: |
              set -e
              rustup target add armv7-unknown-linux-gnueabihf
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR=/
              export PKG_CONFIG_PATH=/usr/lib/arm-linux-gnueabihf/pkgconfig
              export CC=arm-linux-gnueabihf-gcc
              export CXX=arm-linux-gnueabihf-g++
              export AR=arm-linux-gnueabihf-ar
              export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
              bun run build:esm -- --target armv7-unknown-linux-gnueabihf
              bun run build:cjs -- --target armv7-unknown-linux-gnueabihf

          # Android
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: armv7-linux-androideabi

    runs-on: ${{ matrix.settings.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target || matrix.settings.rust_target }}

      - name: Setup Zig for cross-compilation
        if: matrix.settings.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          # Include the target so matrix jobs no longer race to save/restore a
          # single shared key; hash the committed bun.lock (package-lock.json /
          # bun.lockb are absent, so hashing them produced an empty key).
          key: ${{ runner.os }}-${{ matrix.settings.target }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-bun-

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.settings.target }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v5
        with:
          path: target/
          key: ${{ matrix.settings.os }}-${{ matrix.settings.target }}-cargo-build-${{ github.sha }}
          restore-keys: |
            ${{ matrix.settings.os }}-${{ matrix.settings.target }}-cargo-build-

      # No generic apt-get step here: the two steps below know which matrix
      # targets actually need Linux system packages, so Android jobs no longer
      # waste a mirror request on pkg-config/GTK.
      - name: Install system dependencies (Linux x86_64)
        if: runner.os == 'Linux' && matrix.settings.sys_deps
        shell: bash
        run: |
          set -euxo pipefail

          # GitHub's Azure mirror has been hanging and stalling runners for an
          # hour; fall back to the primary mirror so a sick mirror fails/retries
          # in minutes instead of occupying a runner.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if ! grep -q . /etc/apt/apt-mirrors.txt; then
              echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            fi
          fi

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update

          sudo apt-get install -y --no-install-recommends \
            ${{ matrix.settings.sys_deps }}

      - name: Install cross-compilation dependencies (Linux ARM)
        if: runner.os == 'Linux' && matrix.settings.cross_arch
        run: |
          sudo dpkg --add-architecture ${{ matrix.settings.cross_arch }}

          # 1. Fix existing sources to be amd64-only
          # This handles traditional .list files (Jammy 22.04)
          sudo find /etc/apt/sources.list /etc/apt/sources.list.d/ -name "*.list" -type f -exec \
            sudo sed -i -E 's/^(deb(-src)? )([^[])/\1[arch=amd64] \3/' {} +

          # This handles the new DEB822 .sources files (Noble 24.04+)
          # It adds "Architectures: amd64" to blocks that don't have it
          sudo find /etc/apt/sources.list.d/ /etc/apt/ -name "*.sources" -type f -exec \
            sudo sh -c 'grep -q "Architectures:" "$1" || sed -i "/^Types: deb/a Architectures: amd64" "$1"' _ {} \;

          # 2. Add the Ports repository for the cross-architecture (HTTPS)
          CODENAME=$(lsb_release -sc)
          echo "deb [arch=${{ matrix.settings.cross_arch }}] https://ports.ubuntu.com/ubuntu-ports $CODENAME main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/ports.list
          echo "deb [arch=${{ matrix.settings.cross_arch }}] https://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ports.list
          echo "deb [arch=${{ matrix.settings.cross_arch }}] https://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/ports.list

          # 3. Update and install
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            ${{ matrix.settings.cross_gcc }} \
            ${{ matrix.settings.cross_gpp }} \
            ${{ matrix.settings.cross_sys_deps }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        if: ${{ !matrix.settings.build_script }}
        shell: bash
        run: |
          set -euxo pipefail
          bun run build:esm -- --target "${{ matrix.settings.target }}"
          bun run build:cjs -- --target "${{ matrix.settings.target }}"

      - name: Build (custom cross target)
        if: ${{ matrix.settings.build_script }}
        shell: bash
        run: ${{ matrix.settings.build_script }}

      # The out-of-process UI host is a plain desktop binary; Android has no
      # webview-host target.
      - name: Build UI host
        if: ${{ !contains(matrix.settings.target, 'android') }}
        shell: bash
        run: |
          set -euxo pipefail

          # Reconstruct the cross-compilation environment for foreign-arch
          # Linux targets. The main Build step exports CC/CXX/linker/pkg-config
          # only within its own shell, so that state does not survive to this
          # step. Without it gdk-sys cannot find the target pkg-config files and
          # the linker would default to the host toolchain.
          if [ -n "${{ matrix.settings.cross_triplet }}" ]; then
            triplet="${{ matrix.settings.cross_triplet }}"
            target_env="$(echo '${{ matrix.settings.target }}' | tr '[:lower:]-' '[:upper:]_')"

            export CC="${triplet}-gcc"
            export CXX="${triplet}-g++"
            export AR="${triplet}-ar"
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_SYSROOT_DIR=/
            export PKG_CONFIG_PATH="/usr/lib/${triplet}/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_LIBDIR="/usr/lib/${triplet}/pkgconfig:/usr/share/pkgconfig"
            export "CARGO_TARGET_${target_env}_LINKER=${triplet}-gcc"

            pkg-config --modversion gdk-3.0
            pkg-config --modversion webkit2gtk-4.1
          fi

          cargo build -p webview-host --release --target ${{ matrix.settings.target }}
          mkdir -p host-dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.settings.target }}/release/webview-host.exe" \
               "host-dist/webview-host-${{ matrix.settings.target }}.exe"
          else
            cp "target/${{ matrix.settings.target }}/release/webview-host" \
               "host-dist/webview-host-${{ matrix.settings.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node

      - name: Upload UI host artifact
        if: ${{ !contains(matrix.settings.target, 'android') }}
        uses: actions/upload-artifact@v6
        with:
          name: webview-host-${{ matrix.settings.target }}
          path: host-dist/*
          if-no-files-found: error
          retention-days: 7

