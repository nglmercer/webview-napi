[package]
name = "webview-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Out-of-process UI host for webview-napi: owns the tao event loop and speaks JSON-RPC over stdio."

[[bin]]
name = "webview-host"
path = "src/main.rs"

[dependencies]
tao        = "0.35"
wry        = { version = "0.55.1", features = ["devtools"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
